services:
  drive-audit-api:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - SERVICE_ACCOUNT_FILE=/app/drive-audit-service.json
      - API_BEARER_TOKEN=${API_BEARER_TOKEN}
      - EXTERNAL_BASE_URL=${EXTERNAL_BASE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./downloads:/app/downloads
      - ./drive-audit-service.json:/app/drive-audit-service.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s